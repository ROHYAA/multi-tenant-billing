<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layout/base :: layout(~{::content})}">
<body>
<th:block th:fragment="content">
    <p class="greeting">Your plan is expiring soon</p>
    <p class="text">
        Hi <strong th:text="${recipientName}">User</strong>,
        the <strong th:text="${planName}">plan</strong> for
        <strong th:text="${tenantName}">your shop</strong> expires on
        <strong th:text="${subscriptionExpiresAt}">the expiry date</strong>.
        Renew before then to avoid any interruption — an expired plan is automatically
        suspended until it's renewed.
    </p>
    <div class="highlight-box">
        <div class="label">Plan</div>
        <div class="value" th:text="${planName}">Monthly</div>
        <div class="label" style="margin-top:8px;">Expires</div>
        <div class="value" th:text="${subscriptionExpiresAt}">—</div>
    </div>
    <hr class="divider"/>
    <p class="text" style="font-size:13px; color:#6b7280;">
        Already paid? Ignore this — your shop's admin will confirm renewal shortly.
    </p>
</th:block>
</body>
</html>
