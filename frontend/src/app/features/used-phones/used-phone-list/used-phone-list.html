<app-page-header title="Used Phones" [breadcrumbs]="[{ label: 'Dashboard', link: '/dashboard' }, { label: 'Used Phones' }]">
  <a mat-flat-button color="primary" routerLink="/used-phones/new">
    <mat-icon>add_shopping_cart</mat-icon>
    Buy Used Phone
  </a>
</app-page-header>

<div class="mb-4 flex flex-wrap items-center gap-3">
  <mat-form-field appearance="outline" class="w-full max-w-sm" subscriptSizing="dynamic">
    <mat-label>Search</mat-label>
    <mat-icon matPrefix class="mr-1 opacity-60">search</mat-icon>
    <input matInput [formControl]="searchControl" placeholder="IMEI, seller, mobile, model, voucher" />
    @if (searchControl.value) {
      <button mat-icon-button matSuffix (click)="searchControl.setValue('')" aria-label="Clear search">
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>

  <mat-button-toggle-group [value]="status()" (change)="setStatus($event.value)" aria-label="Filter by status">
    <mat-button-toggle value="ALL">All</mat-button-toggle>
    <mat-button-toggle value="IN_STOCK">In stock</mat-button-toggle>
    <mat-button-toggle value="SOLD">Sold</mat-button-toggle>
  </mat-button-toggle-group>
</div>

@if (error(); as message) {
  <div class="flex flex-col items-center gap-3 rounded-lg border border-[var(--mat-sys-error)] py-12 text-center">
    <mat-icon class="!h-10 !w-10 !text-4xl text-[var(--mat-sys-error)]">error_outline</mat-icon>
    <p class="text-sm opacity-80">{{ message }}</p>
    <button mat-stroked-button (click)="retry()">Retry</button>
  </div>
} @else {
  <app-data-table
    [columns]="columns"
    [page]="page()"
    [loading]="loading()"
    emptyTitle="No used phones yet"
    emptyMessage="Buy a phone from a customer to record the seller, ID proof and IMEI here."
    (pageChange)="onPageChange($event)"
  >
    <ng-template #rowActions let-purchase>
      <button mat-icon-button [matMenuTriggerFor]="rowMenu" [attr.aria-label]="'Actions for ' + purchase.voucherNumber">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #rowMenu="matMenu">
        <button mat-menu-item (click)="openVoucher(purchase)">
          <mat-icon>picture_as_pdf</mat-icon>
          <span>Purchase voucher</span>
        </button>
        @if (purchase.status === 'IN_STOCK') {
          <a mat-menu-item routerLink="/bills/new">
            <mat-icon>point_of_sale</mat-icon>
            <span>Sell (new bill)</span>
          </a>
        }
      </mat-menu>
    </ng-template>
  </app-data-table>
}
