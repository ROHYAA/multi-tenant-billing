<app-page-header title="Employees" [breadcrumbs]="[{ label: 'Dashboard', link: '/dashboard' }, { label: 'Employees' }]">
  <button mat-flat-button color="primary" (click)="openCreateDialog()">
    <mat-icon>person_add</mat-icon>
    Add employee
  </button>
</app-page-header>

@if (error(); as message) {
  <div class="flex flex-col items-center gap-3 rounded-lg border border-[var(--mat-sys-error)] py-12 text-center">
    <mat-icon class="!h-10 !w-10 !text-4xl text-[var(--mat-sys-error)]">error_outline</mat-icon>
    <p class="text-sm opacity-80">{{ message }}</p>
    <button mat-stroked-button (click)="retry()">Retry</button>
  </div>
} @else {
  <app-data-table
    [columns]="columns"
    [page]="page()"
    [loading]="loading()"
    emptyTitle="Only you so far"
    emptyMessage="Add an employee so they can bill from this shop."
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
  />
}
