<app-page-header title="Bills" [breadcrumbs]="[{ label: 'Dashboard', link: '/dashboard' }, { label: 'Bills' }]">
  <button mat-flat-button color="primary" routerLink="/bills/new">
    <mat-icon>add</mat-icon>
    New Bill
  </button>
</app-page-header>

<mat-form-field appearance="outline" class="mb-4 w-full max-w-xs">
  <mat-label>Status</mat-label>
  <mat-select [formControl]="statusControl">
    @for (opt of statusOptions; track opt.value) {
      <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
    }
  </mat-select>
</mat-form-field>

@if (error(); as message) {
  <div class="flex flex-col items-center gap-3 rounded-lg border border-[var(--mat-sys-error)] py-12 text-center">
    <mat-icon class="!h-10 !w-10 !text-4xl text-[var(--mat-sys-error)]">error_outline</mat-icon>
    <p class="text-sm opacity-80">{{ message }}</p>
    <button mat-stroked-button (click)="retry()">Retry</button>
  </div>
} @else {
  <app-data-table
    [columns]="columns"
    [page]="page()"
    [loading]="loading()"
    emptyTitle="No bills yet"
    emptyMessage="Create your first bill to see it here."
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
  >
    <ng-template #rowActions let-bill>
      <button
        mat-icon-button
        [disabled]="reprintingId() === bill.id"
        (click)="reprint(bill)"
        [attr.aria-label]="'Reprint bill ' + bill.invoiceNumber"
        matTooltip="Reprint (duplicate copy)"
      >
        <mat-icon>{{ reprintingId() === bill.id ? 'hourglass_empty' : 'print' }}</mat-icon>
      </button>
    </ng-template>
  </app-data-table>
}
