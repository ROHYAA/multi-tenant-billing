<div class="mb-6 flex flex-wrap items-start justify-between gap-3">
  <div>
    @if (breadcrumbs().length > 0) {
      <nav class="mb-1 flex items-center gap-1 text-sm opacity-60" aria-label="Breadcrumb">
        @for (crumb of breadcrumbs(); track crumb.label; let last = $last) {
          @if (crumb.link && !last) {
            <a [routerLink]="crumb.link" class="hover:underline">{{ crumb.label }}</a>
          } @else {
            <span [class.font-medium]="last">{{ crumb.label }}</span>
          }
          @if (!last) {
            <mat-icon class="!h-4 !w-4 !text-base opacity-60">chevron_right</mat-icon>
          }
        }
      </nav>
    }
    <h1 class="text-xl font-semibold">{{ title() }}</h1>
  </div>
  <div class="flex items-center gap-2">
    <ng-content />
  </div>
</div>
